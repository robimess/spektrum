<ion-header>
  <ion-toolbar>
    <ion-title>Historial de Feedback</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="log-actions">
    <button class="btn btn-primary" (click)="exportCsv()" [disabled]="logs.length === 0">
      📥 Exportar CSV
    </button>
    <button class="btn btn-danger" (click)="clearAll()" [disabled]="logs.length === 0">
      🗑️ Limpiar Todo
    </button>
  </div>

  <div *ngIf="logs.length === 0" class="empty-state">
    <p>No hay eventos de feedback registrados.</p>
  </div>

  <ion-list *ngIf="logs.length > 0">
    <ion-item *ngFor="let log of logs">
      <ion-label>
        <h2>{{ formatFreq(log.frequency) }}</h2>
        <p>{{ log.date }} - {{ log.time }}</p>
        <p class="details">{{ log.magnitudeDb }} dB • {{ log.duration }}ms</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
