<ion-header>
  <ion-toolbar>
    <ion-title>SPEKTRUM</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openLogModal()">
        📋 Logs
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-feedback-alert></app-feedback-alert>

  <div style="padding:12px;">
    <div class="controls-row">
      <label class="control-item">
        Vista:
        <select [value]="view" (change)="onView($any($event.target).value)">
          <option value="spectrogram">Espectrograma</option>
          <option value="bars">Barras</option>
        </select>
      </label>

      <app-mic-selector (deviceSelected)="onMicSelected($event)"></app-mic-selector>

      <label class="control-item">
        <input type="checkbox" [checked]="feedbackEnabled" (change)="toggleFeedback()">
        Detector Feedback
      </label>

      <label class="control-item">
        <input type="checkbox" [checked]="aiEnabled" (change)="toggleAI()">
        IA Activa
      </label>
    </div>

<canvas
  #specCanvas
  [style.display]="view==='spectrogram' ? 'block' : 'none'"
  style="width:100%; height:240px; background:#000;">
</canvas>

    <app-bars-view 
      *ngIf="view==='bars'" 
      [sampleRate]="sampleRate" 
      [resolution]="preset" 
      [holdMs]="holdMs"
      [useColor]="useColor" 
      [showGrid]="showGrid" 
      [gamma]="gamma" 
      [palette]="palette" 
      #bars>
    </app-bars-view>

    <div class="controls-row">
      <label class="control-item">
        <input type="checkbox" [checked]="useColor" (change)="onToggleColor($any($event.target).checked)">
        Color
      </label>

      <label class="control-item">
        <input type="checkbox" [checked]="showGrid" (change)="onToggleGrid($any($event.target).checked)">
        Grilla
      </label>

      <label class="control-item">
        Paleta:
        <select [value]="palette" (change)="onPalette($any($event.target).value)">
          <option value="viridis">viridis</option>
          <option value="magma">magma</option>
          <option value="inferno">inferno</option>
          <option value="plasma">plasma</option>
          <option value="gray">gray</option>
        </select>
      </label>

      <label class="control-item flex-slider">
        Gamma:
        <input type="range" min="0.5" max="2.5" step="0.1" [value]="gamma" (input)="onGamma($any($event.target).value)">
        <span>{{ gamma.toFixed(1) }}</span>
      </label>
    </div>

    <div class="controls-row">
      <label class="control-item">
        Resolución:
        <select [value]="preset" (change)="onPreset($any($event.target).value)">
          <option value="octava">Octava</option>
          <option value="media">1/2 octava</option>
          <option value="tercio">1/3 octava</option>
        </select>
      </label>

      <label class="control-item">
        HOLD:
        <select [value]="holdMs" (change)="onHoldChange(+$any($event.target).value)">
          <option [value]="0">Off</option>
          <option [value]="500">0.5s</option>
          <option [value]="1000">1s</option>
          <option [value]="2000">2s</option>
          <option [value]="999999">∞</option>
        </select>
      </label>
    </div>

    <p class="info-text">
      Si no ves actividad, concede permiso de micrófono y asegúrate de tener señal de entrada.
    </p>
  </div>
</ion-content>
