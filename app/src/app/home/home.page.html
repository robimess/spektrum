<ion-header>
  <ion-toolbar>
    <ion-title>SPEKTRUM</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openLogModal()">
        <ion-icon name="list-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="openSettings()">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="instrument-content">
  <app-feedback-alert></app-feedback-alert>

  <div class="home-shell" [class.is-light]="isLightTheme">
    <!-- Runtime notices -->
    <div class="runtime-overlay" *ngIf="runtimeNotices.length > 0">
      <div
        *ngFor="let notice of runtimeNotices"
        class="runtime-item"
        [class.is-info]="notice.tone === 'info'"
        [class.is-warn]="notice.tone === 'warn'"
        [class.is-danger]="notice.tone === 'danger'">
        <ion-icon
          [name]="notice.tone === 'danger' ? 'alert-circle-outline' : notice.tone === 'warn' ? 'warning-outline' : 'information-circle-outline'">
        </ion-icon>
        <span>{{ notice.text }}</span>
      </div>
    </div>

    <!-- Canvas hero -->
    <div class="canvas-stage">
      <div #analysisFrame class="analysis-frame" [class.is-bars]="view === 'bars'">
        <canvas
          #specCanvas
          class="analysis-surface analysis-surface--spectrogram"
          [class.is-hidden]="view !== 'spectrogram'"
          [style.background]="isLightTheme ? '#f4f7fb' : '#020617'">
        </canvas>

        <app-bars-view
          *ngIf="view === 'bars'"
          class="analysis-surface analysis-surface--bars"
          [sampleRate]="sampleRate"
          [resolution]="preset"
          [holdMs]="holdMs"
          [useColor]="useColor"
          [showGrid]="showGrid"
          [gamma]="gamma"
          [signalStatus]="audioSignalDiagnostics?.status ?? 'unknown'"
          [signalRmsDbFs]="audioSignalDiagnostics?.rmsDbFs ?? -180"
          [palette]="paletteObj"
          #bars>
        </app-bars-view>

        <div class="analysis-overlay">
          <span class="overlay-pill">{{ activeInputLabel }}</span>
          <span class="overlay-pill">{{ resolutionLabel }}</span>
          <span class="overlay-pill mono">+{{ feedbackThresholdDb }} dB</span>
          <span class="overlay-pill">{{ holdLabel }}</span>
          <span class="overlay-pill">{{ sampleRate }} Hz</span>
        </div>

        <div class="canvas-actions" *ngIf="view === 'bars' && isInfiniteHold">
          <ion-button fill="clear" color="light" size="small" (click)="resetHoldPeaks()">
            <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>

    <!-- Bottom toolbar -->
    <div class="bottom-toolbar">
      <div class="toolbar-group">
        <ion-segment [value]="inputMode" (ionChange)="onInputModeChange($any($event.detail.value))" class="toolbar-segment">
          <ion-segment-button value="microphone">
            <ion-icon name="mic-outline"></ion-icon>
          </ion-segment-button>
          <ion-segment-button value="demo">
            <ion-icon name="musical-notes-outline"></ion-icon>
          </ion-segment-button>
        </ion-segment>
      </div>

      <div class="toolbar-group toolbar-group--center">
        <ion-button fill="clear" size="small" [color]="feedbackEnabled ? 'primary' : 'medium'" (click)="toggleFeedback()">
          <ion-icon name="warning-outline" slot="start"></ion-icon>
          Feedback
        </ion-button>
        <ion-button fill="clear" size="small" [color]="aiEnabled ? 'primary' : 'medium'" (click)="toggleAI()">
          <ion-icon name="bulb-outline" slot="start"></ion-icon>
          IA
        </ion-button>
      </div>

      <div class="toolbar-group toolbar-group--right">
        <ion-segment [value]="view" (ionChange)="onView($any($event.detail.value))" class="toolbar-segment">
          <ion-segment-button value="spectrogram">
            <ion-icon name="analytics-outline"></ion-icon>
          </ion-segment-button>
          <ion-segment-button value="bars">
            <ion-icon name="bar-chart-outline"></ion-icon>
          </ion-segment-button>
        </ion-segment>
      </div>
    </div>

    <!-- Mic selector (when in microphone mode) -->
    <div class="mic-strip" *ngIf="inputMode === 'microphone'">
      <app-mic-selector (deviceSelected)="onMicSelected($event)"></app-mic-selector>
      <ion-button
        *ngIf="showActivateMicrophoneButton"
        fill="solid"
        color="primary"
        size="small"
        (click)="requestMicrophoneAccess()">
        <ion-icon name="mic-outline" slot="start"></ion-icon>
        Activar
      </ion-button>
    </div>

    <!-- Export action -->
    <div class="export-strip">
      <ion-button fill="clear" color="medium" size="small" (click)="exportAnalysisImage()">
        <ion-icon name="download-outline" slot="start"></ion-icon>
        Captura
      </ion-button>
      <p *ngIf="analysisExportMessage" class="export-msg">{{ analysisExportMessage }}</p>
    </div>
  </div>
</ion-content>
